name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A small markdown doc that shows the problem helps a lot.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `markdown-review --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Your operating system, browser, Node.js version and coding agent.
