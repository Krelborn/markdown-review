name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the next step can find the commit on main
          fetch-depth: 0

      - name: Check the release's commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The release's commit is not on main"
            exit 1
          fi

      - name: Check the release matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release is tagged $TAG, but package.json has version $version"
            exit 1
          fi
          # Build metadata such as +build.1 can contain a hyphen too
          case "${version%%+*}" in
            *-*) expected=true ;;
            *) expected=false ;;
          esac
          if [ "$PRERELEASE" != "$expected" ]; then
            echo "::error::Mark the release as a pre-release exactly when its version has a pre-release part, such as 0.2.0-beta.1"
            exit 1
          fi

  verify:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No cache: a poisoned one would ship in the package.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # pnpm pack doesn't run prepublishOnly, so build first
      - run: pnpm build

      # The same tarball `pnpm publish` would build, so the publish job needs no install
      - run: pnpm pack --out package.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package.tgz
          if-no-files-found: error
          retention-days: 1

  # Can publish to npm, so it checks nothing out, installs nothing and runs no project code
  publish:
    needs: build
    runs-on: ubuntu-latest
    # npm's trusted publisher accepts only this environment, so the site job's OIDC token cannot publish
    environment: npm
    permissions:
      # npm trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # npm stage needs npm 11.15 or later, which Node 24.18 and later bundle.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      # A maintainer approves the staged version on npmjs.com.
      - run: npm stage publish ./package.tgz --ignore-scripts --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}

  site:
    needs: publish
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read
      # Deploy to GitHub Pages
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
